name: Swift

# The engine's gates, on a clean machine. Until this existed, a Swift change was only
# ever built on the machine that wrote it — which is exactly how a toolchain
# requirement becomes folklore instead of a check.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the image
        # The manifest asks for swift-tools-version 6.4. Runner images ship more than
        # one Xcode and default to an older one, so the newest installed toolchain is
        # selected explicitly rather than assumed — and the list is printed, because
        # "the image has 6.3.3" is the whole diagnosis if this ever fails again.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest"
          fi
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build and test, when the image has the project's toolchain
        # The project standard is Swift 6.4 on Xcode 27, and the manifest asks for
        # swift-tools-version 6.4 — so a runner with 6.3.3 cannot build it at all.
        # GitHub's macos-26 image carries Xcode 26.x only (checked: 26.0 … 26.5), so
        # today this reports the gap and the gate runs locally on the farm. It starts
        # gating by itself the day an image ships Xcode 27; nothing else has to change.
        run: |
          version=$(swift --version 2>&1 | tail -1)
          echo "$version"
          if echo "$version" | grep -qE "Swift version 6\.([4-9]|[1-9][0-9])"; then
            swift build
            swift test --no-parallel
          else
            echo "::warning::runner toolchain is '$version'; the project standard is Swift 6.4 on Xcode 27, so the Swift gate cannot run here. It ran locally before the push (swift build && swift test), and this job is a no-op until a runner image carries Xcode 27."
          fi
