name: Swift

# The engine's gates, on a clean machine. Until this existed, a Swift change was only
# ever built on the machine that wrote it — which is exactly how a toolchain
# requirement becomes folklore instead of a check.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the image
        # The manifest asks for swift-tools-version 6.4. Runner images ship more than
        # one Xcode and default to an older one, so the newest installed toolchain is
        # selected explicitly rather than assumed — and the list is printed, because
        # "the image has 6.3.3" is the whole diagnosis if this ever fails again.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest"
          fi
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        # --no-parallel because the numeric tests are the point and a serial run is
        # easier to attribute when one fails.
        run: swift test --no-parallel
