name: Swift

# The engine's gates, on a clean machine. Until this existed, a Swift change was only
# ever built on the machine that wrote it — which is exactly how a toolchain
# requirement becomes folklore instead of a check.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    # `macos-26` because it is the newest label that exists; it carries Xcode 26.x, so the
    # toolchain step below fails here until an image ships Xcode 27 — at which point this
    # label moves to `macos-27` and nothing else changes. The failure is the point: it names
    # the gap instead of letting a skipped check look like a passing one.
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode on the image
        # The manifest asks for swift-tools-version 6.4. Runner images ship more than
        # one Xcode and default to an older one, so the newest installed toolchain is
        # selected explicitly rather than assumed — and the list is printed, because
        # "the image has 6.3.3" is the whole diagnosis if this ever fails again.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest"
          fi
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Require the project toolchain — Xcode 27 with Swift 6.4
        # There is no skip branch, deliberately. The project uses Xcode 27 with Swift 6.4 and
        # supports no other toolchain, so a runner that cannot provide it must FAIL this job
        # rather than warn and move on: a check that cannot run must never look like a check
        # that passed. The step it replaces read `swift --version | tail -1` — the *target*
        # line — so its pattern could never match and it took the skip branch on every runner
        # it ever saw. `tools/check_toolchain.py` parses the output properly and refuses
        # anything that is not the standard, with tests that pin both halves of that mistake.
        run: python3 tools/check_toolchain.py
      - name: Build, test, and check the claims about them
        # Unconditional, because the step above has already established the toolchain. A red
        # run here means the runner image is below the standard, not that the code is broken.
        #
        # The whole gate set rather than `swift build` and `swift test` by hand, because this job
        # is the only one that can see both halves at once and the counts in the documentation are
        # a claim about them. The other workflow runs `--skip-swift`, which reports the Swift half
        # NOT CHECKED — the honest thing for it to say — so before this step the claimed
        # "200 tests, 0 skipped, 0 failures" was compared to a real run **nowhere in CI**: a
        # silently deleted test would have left every document correct about a suite that no
        # longer existed. `run_all_gates.py` reads the counts from the runs themselves and hands
        # them to the claims gate, so this step cannot go stale against them.
        run: python3 tools/run_all_gates.py
